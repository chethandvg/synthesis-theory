[package]
name = "synthesis-theory-py"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
name = "synthesis_theory"
crate-type = ["cdylib"]

[dependencies]
synthesis_theory_rs = { package = "synthesis-theory", path = "../.." }
pyo3 = { version = "0.30.1", features = ["abi3-py310"] }
# rust-numpy, the PyO3 project's NumPy bindings (BSD-2-Clause): results come back as numpy arrays.
numpy = "0.30.0"

# A separate workspace, so the core crate's `cargo test` never links Python.
[workspace]
